<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg);}
.card-frame{padding:20px 24px;box-sizing:border-box;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
.swatch{display:flex;flex-direction:column;gap:6px;}
.chip{width:96px;height:64px;border-radius:8px;border:1px solid var(--border);}
.chip-sm{width:64px;height:48px;border-radius:6px;border:1px solid var(--border);}
.label{font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;}
.value{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-tertiary);}
.name{font-size:13px;color:var(--text-primary);font-weight:500;}
</style></head><body><div class="card-frame">
<table style="width:100%;border-collapse:collapse;font-size:14px;">
  <thead><tr style="background:var(--stone-50);">
    <th style="text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;border-bottom:1px solid var(--border);">Name</th><th style="text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;border-bottom:1px solid var(--border);">Size</th><th style="text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;border-bottom:1px solid var(--border);">Modified</th><th style="text-align:left;padding:10px 12px;font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;border-bottom:1px solid var(--border);">Visibility</th>
  </tr></thead>
  <tbody>
    
      <tr style="border-bottom:1px solid var(--border);"><td style="padding:10px 12px;color:var(--text-primary);">hero-image.jpg</td><td style="padding:10px 12px;color:var(--text-secondary);">2.4 MB</td><td style="padding:10px 12px;color:var(--text-secondary);">2 hours ago</td><td style="padding:10px 12px;color:var(--text-secondary);">public</td></tr>
    
      <tr style="border-bottom:1px solid var(--border);"><td style="padding:10px 12px;color:var(--text-primary);">avatars/user-832.png</td><td style="padding:10px 12px;color:var(--text-secondary);">48 KB</td><td style="padding:10px 12px;color:var(--text-secondary);">yesterday</td><td style="padding:10px 12px;color:var(--text-secondary);">public</td></tr>
    
      <tr style="border-bottom:1px solid var(--border);"><td style="padding:10px 12px;color:var(--text-primary);">exports/2026-05.csv</td><td style="padding:10px 12px;color:var(--text-secondary);">12.1 MB</td><td style="padding:10px 12px;color:var(--text-secondary);">3 days ago</td><td style="padding:10px 12px;color:var(--text-secondary);">private</td></tr>
    
  </tbody>
</table>
</div></body></html>
