<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg);font-family:var(--font-sans);}
.card-frame{padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;padding:48px 24px;border:1px dashed var(--border-strong);border-radius:12px;background:var(--bg-elevated);}
.icon{width:44px;height:44px;background:var(--stone-100);border-radius:999px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);margin-bottom:14px;}
.t{font-size:16px;font-weight:500;color:var(--text-primary);}
.b{font-size:14px;color:var(--text-secondary);margin-top:4px;max-width:340px;line-height:1.5;}
.btn{margin-top:16px;padding:8px 14px;border-radius:8px;background:var(--ink);color:var(--cream);border:0;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px;}
.note{font-size:12px;color:var(--text-secondary);margin:0;}
</style></head><body><div class="card-frame">
<div class="empty">
  <div class="icon">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18l-1.5 13a2 2 0 0 1-2 1.7H6.5a2 2 0 0 1-2-1.7L3 6Z"/><path d="M3 6 6 3h12l3 3"/><path d="M9 10v6"/><path d="M15 10v6"/></svg>
  </div>
  <div class="t">No buckets yet</div>
  <div class="b">Create your first bucket to start uploading files. Each bucket lives on-chain as a Sui object you control.</div>
  <button class="btn">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M12 5v14"/><path d="M5 12h14"/></svg>
    Create bucket
  </button>
</div>
<p class="note">Same shape, swappable icon + title + body + CTA. Used for empty buckets, empty file lists, no API keys, no activity events.</p>
</div></body></html>
