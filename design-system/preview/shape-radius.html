<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg);}
.card-frame{padding:20px 24px;box-sizing:border-box;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
.swatch{display:flex;flex-direction:column;gap:6px;}
.chip{width:96px;height:64px;border-radius:8px;border:1px solid var(--border);}
.chip-sm{width:64px;height:48px;border-radius:6px;border:1px solid var(--border);}
.label{font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;}
.value{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-tertiary);}
.name{font-size:13px;color:var(--text-primary);font-weight:500;}
</style></head><body><div class="card-frame">
<div style="display:flex;gap:24px;align-items:flex-end;">
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="width:96px;height:96px;background:var(--stone-100);border:1px solid var(--border);border-radius:4px;"></div><span class="name">sm · 4px</span><span class="value">inputs, pills</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="width:96px;height:96px;background:var(--stone-100);border:1px solid var(--border);border-radius:8px;"></div><span class="name">md · 8px</span><span class="value">cards, dialogs</span></div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:8px;"><div style="width:96px;height:96px;background:var(--stone-100);border:1px solid var(--border);border-radius:12px;"></div><span class="name">lg · 12px</span><span class="value">hero panels</span></div>
</div>
</div></body></html>
