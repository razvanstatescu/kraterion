<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg);}
.card-frame{padding:20px 24px;box-sizing:border-box;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
.swatch{display:flex;flex-direction:column;gap:6px;}
.chip{width:96px;height:64px;border-radius:8px;border:1px solid var(--border);}
.chip-sm{width:64px;height:48px;border-radius:6px;border:1px solid var(--border);}
.label{font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;}
.value{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-tertiary);}
.name{font-size:13px;color:var(--text-primary);font-weight:500;}
</style></head><body><div class="card-frame">
<div style="display:flex;flex-direction:column;gap:14px;">
  
    <div style="display:flex;align-items:baseline;gap:24px;">
      <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;width:60px;">72px</span>
      <span style="font-size:72px;font-weight:500;line-height:1.1;color:var(--text-primary);">Display</span>
      <span style="font-size:13px;color:var(--text-tertiary);margin-left:auto;">Marketing hero</span>
    </div>
  
    <div style="display:flex;align-items:baseline;gap:24px;">
      <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;width:60px;">48px</span>
      <span style="font-size:48px;font-weight:500;line-height:1.1;color:var(--text-primary);">H1</span>
      <span style="font-size:13px;color:var(--text-tertiary);margin-left:auto;">Page title</span>
    </div>
  
    <div style="display:flex;align-items:baseline;gap:24px;">
      <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;width:60px;">32px</span>
      <span style="font-size:32px;font-weight:500;line-height:1.1;color:var(--text-primary);">H2</span>
      <span style="font-size:13px;color:var(--text-tertiary);margin-left:auto;">Section</span>
    </div>
  
    <div style="display:flex;align-items:baseline;gap:24px;">
      <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;width:60px;">24px</span>
      <span style="font-size:24px;font-weight:500;line-height:1.1;color:var(--text-primary);">H3</span>
      <span style="font-size:13px;color:var(--text-tertiary);margin-left:auto;">Subsection</span>
    </div>
  
    <div style="display:flex;align-items:baseline;gap:24px;">
      <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;width:60px;">18px</span>
      <span style="font-size:18px;font-weight:400;line-height:1.1;color:var(--text-primary);">Lead</span>
      <span style="font-size:13px;color:var(--text-tertiary);margin-left:auto;">Intro paragraph</span>
    </div>
  
    <div style="display:flex;align-items:baseline;gap:24px;">
      <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;width:60px;">16px</span>
      <span style="font-size:16px;font-weight:400;line-height:1.1;color:var(--text-primary);">Body</span>
      <span style="font-size:13px;color:var(--text-tertiary);margin-left:auto;">Default</span>
    </div>
  
    <div style="display:flex;align-items:baseline;gap:24px;">
      <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;width:60px;">14px</span>
      <span style="font-size:14px;font-weight:400;line-height:1.1;color:var(--text-primary);">Small</span>
      <span style="font-size:13px;color:var(--text-tertiary);margin-left:auto;">Captions, table cells</span>
    </div>
  
    <div style="display:flex;align-items:baseline;gap:24px;">
      <span style="font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;width:60px;">11px</span>
      <span style="font-size:11px;font-weight:400;line-height:1.1;color:var(--text-primary);text-transform:uppercase;letter-spacing:0.16em;font-weight:500;">Micro</span>
      <span style="font-size:13px;color:var(--text-tertiary);margin-left:auto;">UPPERCASE EYEBROWS</span>
    </div>
  
</div>
</div></body></html>
