<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg);}
.card-frame{padding:20px 24px;box-sizing:border-box;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
.swatch{display:flex;flex-direction:column;gap:6px;}
.chip{width:96px;height:64px;border-radius:8px;border:1px solid var(--border);}
.chip-sm{width:64px;height:48px;border-radius:6px;border:1px solid var(--border);}
.label{font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;}
.value{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-tertiary);}
.name{font-size:13px;color:var(--text-primary);font-weight:500;}
</style></head><body><div class="card-frame">
<div style="display:flex;align-items:flex-end;gap:6px;height:140px;">
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="width:4px;height:4px;background:#C45B36;border-radius:2px;"></div>

    </div>

    </div>

    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">

    </div>
  
    <div style="display:flex;flex-direction:column;align-items:center;gap:6px;">
      <div style="width:96px;height:96px;background:#C45B36;border-radius:2px;"></div>
      <span style="font-size:11px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;color:var(--text-tertiary);">96</span>

    </div>
  
</div>
<div style="font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;margin-top:16px;">4px base — 4 · 8 · 12 · 16 · 24 · 32 · 48 · 64 · 96 · 128</div>
