<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg);}
.card-frame{padding:20px 24px;box-sizing:border-box;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
.swatch{display:flex;flex-direction:column;gap:6px;}
.chip{width:96px;height:64px;border-radius:8px;border:1px solid var(--border);}
.chip-sm{width:64px;height:48px;border-radius:6px;border:1px solid var(--border);}
.label{font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;}
.value{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-tertiary);}
.name{font-size:13px;color:var(--text-primary);font-weight:500;}
</style></head><body><div class="card-frame">
<table style="width:100%;border-collapse:collapse;font-size:13px;">
  <thead><tr>
    <th style="text-align:left;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;border-bottom:1px solid var(--border);">Token</th>
    <th style="text-align:left;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;border-bottom:1px solid var(--border);">Light</th>
    <th style="text-align:left;padding:8px 12px;font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;border-bottom:1px solid var(--border);">Dark</th>
  </tr></thead>
  <tbody>
    
      <tr><td style="padding:7px 12px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;color:var(--text-primary);">--bg</td>
      <td style="padding:7px 12px;color:var(--text-secondary);">Cream</td>
      <td style="padding:7px 12px;color:var(--text-secondary);">Ink</td></tr>
    
      <tr><td style="padding:7px 12px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;color:var(--text-primary);">--bg-surface</td>
      <td style="padding:7px 12px;color:var(--text-secondary);">Stone-50</td>
      <td style="padding:7px 12px;color:var(--text-secondary);">Stone-800</td></tr>
    
      <tr><td style="padding:7px 12px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;color:var(--text-primary);">--bg-elevated</td>
      <td style="padding:7px 12px;color:var(--text-secondary);">#FFFFFF</td>
      <td style="padding:7px 12px;color:var(--text-secondary);">Stone-700</td></tr>
    
      <tr><td style="padding:7px 12px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;color:var(--text-primary);">--text-primary</td>
      <td style="padding:7px 12px;color:var(--text-secondary);">Ink</td>
      <td style="padding:7px 12px;color:var(--text-secondary);">Cream</td></tr>
    
      <tr><td style="padding:7px 12px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;color:var(--text-primary);">--text-secondary</td>
      <td style="padding:7px 12px;color:var(--text-secondary);">Stone-600</td>
      <td style="padding:7px 12px;color:var(--text-secondary);">Stone-400</td></tr>
    
      <tr><td style="padding:7px 12px;font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;color:var(--text-primary);">--border</td>
      <td style="padding:7px 12px;color:var(--text-secondary);">Stone-200</td>
      <td style="padding:7px 12px;color:var(--text-secondary);">Stone-700</td></tr>
    
  </tbody>
</table>
</div></body></html>
