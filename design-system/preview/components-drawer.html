<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg);font-family:var(--font-sans);}
.card-frame{padding:24px;box-sizing:border-box;display:flex;justify-content:center;}
.drawer{
  width:420px;background:var(--bg-elevated);border:1px solid var(--border);
  border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 10px 40px -10px rgba(15,14,12,0.18);
}
.head{display:flex;align-items:flex-start;justify-content:space-between;padding:20px 24px;border-bottom:1px solid var(--border);}
.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-tertiary);margin-bottom:4px;}
.title{font-size:18px;font-weight:500;color:var(--text-primary);}
.x{width:28px;height:28px;border-radius:6px;border:0;background:transparent;color:var(--text-tertiary);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;}
.body{padding:20px 24px;font-size:14px;color:var(--text-secondary);line-height:1.55;}
.body p{margin:0 0 12px;}
.row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid var(--border);font-size:13px;}
.row:last-child{border-bottom:0;}
.lab{color:var(--text-tertiary);}
.val{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:12px;color:var(--text-primary);display:inline-flex;align-items:center;gap:6px;}
.foot{padding:16px 24px;border-top:1px solid var(--border);display:flex;gap:8px;justify-content:flex-end;}
.btn{padding:8px 14px;border-radius:8px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;border:1px solid transparent;}
.ghost{background:transparent;border-color:var(--border);color:var(--text-primary);}
.primary{background:var(--ink);color:var(--cream);}
.section-title{font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-tertiary);margin:0 0 8px;font-weight:500;}
</style></head><body><div class="card-frame">
<div class="drawer">
  <div class="head">
    <div>
      <div class="eyebrow">File</div>
      <div class="title">vacation-photo.jpg</div>
    </div>
    <button class="x"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
  </div>
  <div class="body">
    <p class="section-title">Object</p>
    <div class="row"><span class="lab">Size</span><span class="val" style="font-family:inherit;">2.4 MB</span></div>
    <div class="row"><span class="lab">Type</span><span class="val" style="font-family:inherit;">image/jpeg</span></div>
    <div class="row"><span class="lab">Access</span><span class="val" style="font-family:inherit;">🔒 Private</span></div>

    <p class="section-title" style="margin-top:20px;">On-chain</p>
    <div class="row"><span class="lab">Walrus blob</span><a class="val" href="#" style="text-decoration:none;color:var(--text-primary);">0x9a7f…f3c2 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></a></div>
    <div class="row"><span class="lab">Sui object</span><a class="val" href="#" style="text-decoration:none;color:var(--text-primary);">0x2bf4…a8d1 <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17 17 7"/><path d="M7 7h10v10"/></svg></a></div>
    <div class="row"><span class="lab">Funded until</span><span class="val" style="font-family:inherit;">Epoch 247 · ~Sep 22, 2026</span></div>
  </div>
  <div class="foot">
    <button class="btn ghost">Close</button>
    <button class="btn primary">Download</button>
  </div>
</div>
</div></body></html>
