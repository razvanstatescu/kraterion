<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../colors_and_type.css"><style>
html,body{margin:0;padding:0;background:var(--bg);}
.card-frame{padding:20px 24px;box-sizing:border-box;}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-start;}
.swatch{display:flex;flex-direction:column;gap:6px;}
.chip{width:96px;height:64px;border-radius:8px;border:1px solid var(--border);}
.chip-sm{width:64px;height:48px;border-radius:6px;border:1px solid var(--border);}
.label{font-size:11px;text-transform:uppercase;letter-spacing:0.16em;color:var(--text-secondary);font-weight:500;}
.value{font-family:'JetBrains Mono',ui-monospace,Menlo,monospace;font-size:11px;color:var(--text-tertiary);}
.name{font-size:13px;color:var(--text-primary);font-weight:500;}
</style></head><body><div class="card-frame">
<div class="row" style="gap:8px;">
  
    <div class="swatch"><div class="chip-sm" style="background:#FAF7EF"></div><span class="name" style="font-size:11px;">50</span><span class="value">#FAF7EF</span></div>
  
    <div class="swatch"><div class="chip-sm" style="background:#F1ECE0"></div><span class="name" style="font-size:11px;">100</span><span class="value">#F1ECE0</span></div>
  
    <div class="swatch"><div class="chip-sm" style="background:#E1D9C7"></div><span class="name" style="font-size:11px;">200</span><span class="value">#E1D9C7</span></div>
  
    <div class="swatch"><div class="chip-sm" style="background:#C9BFA8"></div><span class="name" style="font-size:11px;">300</span><span class="value">#C9BFA8</span></div>
  
    <div class="swatch"><div class="chip-sm" style="background:#A89C82"></div><span class="name" style="font-size:11px;">400</span><span class="value">#A89C82</span></div>
  
    <div class="swatch"><div class="chip-sm" style="background:#7C7158"></div><span class="name" style="font-size:11px;">500</span><span class="value">#7C7158</span></div>
  
    <div class="swatch"><div class="chip-sm" style="background:#5B5142"></div><span class="name" style="font-size:11px;">600</span><span class="value">#5B5142</span></div>
  
    <div class="swatch"><div class="chip-sm" style="background:#403930"></div><span class="name" style="font-size:11px;">700</span><span class="value">#403930</span></div>
  
    <div class="swatch"><div class="chip-sm" style="background:#2A251D"></div><span class="name" style="font-size:11px;">800</span><span class="value">#2A251D</span></div>
  
    <div class="swatch"><div class="chip-sm" style="background:#1A1610"></div><span class="name" style="font-size:11px;">900</span><span class="value">#1A1610</span></div>
  
</div>
<p class="value" style="margin-top:14px;color:var(--text-secondary);font-family:var(--font-sans);font-size:12px;">Stone — warm neutrals. Cool greys are forbidden across the system.</p>
</div></body></html>
