# Local dev dependencies. App services run on the host via `pnpm dev`.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kraterion
      POSTGRES_PASSWORD: kraterion
      POSTGRES_DB: kraterion
    ports:
      - "5432:5432"
    volumes:
      - kraterion-pg:/var/lib/postgresql/data

  redis:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    volumes:
      - kraterion-redis:/data

volumes:
  kraterion-pg:
  kraterion-redis:
